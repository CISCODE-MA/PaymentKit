name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    attributes:
      label: PaymentKit Version
      placeholder: "v1.1.0"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Gateway
      options:
        - Stripe
        - PayPal
        - Both
    validations:
      required: true